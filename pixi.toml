[workspace]
authors = ["Hong-yiii <hongyilin.mail@gmail.com>"]
channels = ["conda-forge"]
name = "graphrag"
platforms = ["osx-arm64", "win-64"]
version = "0.1.0"

[tasks]

[dependencies]
python = "3.12.*"
pip = ">=25.2,<26"


[pypi-dependencies]
# graphrag = ">=0.5.0"
graphrag = { path = "./custom_packages/graphrag", editable = true }
requests = "*"
datasets = "==3.6.0"
pandas = ">=1.5.0"
tqdm = ">=4.64.0"
python-dotenv = ">=0.19.0"
plotly = ">=5.0.0"
matplotlib = ">=3.5.0"
networkx = ">=2.8"
yfiles-jupyter-graphs = ">=1.0.0"
jupyter = ">=1.0.0"
haystack-ai = ">=2.13.1,<3"
sentence-transformers = ">=4.1.0"
